<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام لجنة التدريب</title>
<style>
:root{--t:#1f6174;--m:#73a899;--c:#f1e1bc;--y:#ebb43e;--o:#da5d37;--bg:#f5f8f7;--ink:#20343b;--line:#dfe9e6;--ok:#25765a}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hero{background:linear-gradient(135deg,var(--t),#2b7b8b);color:#fff;padding:34px 15px;text-align:center}.hero h1{margin:7px 0;font-size:31px}.hero p{margin:0;opacity:.92}.wrap{max-width:1180px;margin:22px auto;padding:0 14px}.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}.btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer}.primary{background:var(--t);color:white}.secondary{background:white;color:var(--t);border:1px solid var(--line)}.accent{background:var(--o);color:#fff}.success{background:var(--ok);color:#fff}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 7px 24px #1f61740f}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:15px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid #ccd9d7;border-radius:10px;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.card h3{margin:0 0 7px;color:var(--t)}.muted{color:#6c7d82;font-size:14px}.pill{display:inline-block;background:var(--c);padding:5px 9px;border-radius:999px;font-size:12px;margin:3px}.pill.teal{background:#e5f2ef;color:#236552}.pill.warn{background:#fff1da;color:#8d5a00}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.table th{background:#f2f7f6;color:var(--t)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}.stat b{font-size:28px;color:var(--t);display:block}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:700;color:var(--t);font-size:14px}.field label span{color:var(--o)}.field label small{font-weight:400;color:#718187}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ccd9d7;border-radius:10px;background:white}.field textarea{min-height:100px;resize:vertical}.form{align-items:start}.form .full{grid-column:1/-1}.notice{background:#fff8e7;border:1px solid #f2ddad;padding:10px 12px;border-radius:10px;margin:10px 0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.category-summary{margin:10px 0}.checkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.check{border:1px solid var(--line);border-radius:10px;padding:10px}.empty{padding:30px;text-align:center;color:#718187}@media(max-width:750px){.toolbar,.form{grid-template-columns:1fr}.hero h1{font-size:26px}}
</style></head><body>
<header class="hero"><div style="font-size:34px">🎓</div><h1>نظام لجنة التدريب</h1><p>المعهد العالي للعلوم الإدارية بأوسيم</p></header>
<main class="wrap"><nav class="nav"><button class="btn primary" onclick="showCourses()">الدورات التدريبية</button><button class="btn secondary" onclick="showStats()">الإحصائيات</button><button class="btn secondary" onclick="showCommittee()">لجنة التدريب</button><button class="btn accent" onclick="login()">🔐 دخول المسؤول</button></nav>
<section id="public" class="panel"><div class="toolbar"><input id="q" placeholder="ابحث باسم الدورة أو المدرب أو المكان" oninput="renderCourses()"><select id="year" onchange="renderCourses()"><option value="">كل الأعوام</option></select><select id="cat" onchange="renderCourses()"><option value="">كل الفئات</option><option>طالب</option><option>عضو هيئة تدريس</option><option>عضو هيئة معاونة</option><option>إداري</option><option>قيادي</option></select><button class="btn secondary" onclick="loadCourses()">تحديث</button></div><div id="content">جاري التحميل...</div></section>
<section id="detail" class="panel hidden"></section><section id="admin" class="panel hidden"></section></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzi5TSIokmigJfV1mDQmhzq7B_mrdp5WW9lj2I72aalGwi9sUKXRWwddNwbjHOgFfE/exec'; let courses=[], adminPassword=''; const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(payload){if(API_URL.includes('PUT_APPS'))throw Error('ضع رابط Web App أولاً');const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});return r.json()}
function hideAll(){['public','detail','admin'].forEach(x=>$(x).classList.add('hidden'))}
function catsHtml(o){return Object.entries(o||{}).map(([k,v])=>`<span class="pill teal">${esc(k)}: ${esc(v)}</span>`).join('')}
async function loadCourses(){try{const r=await api({action:'listCourses'});if(!r.success)throw Error(r.message);courses=r.courses||[];fillYears();renderCourses()}catch(e){$('content').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
function fillYears(){const y=$('year'),old=y.value,years=[...new Set(courses.map(c=>c.AcademicYear).filter(Boolean))].sort().reverse();y.innerHTML='<option value="">كل الأعوام</option>'+years.map(v=>`<option>${esc(v)}</option>`).join('');y.value=old}
function renderCourses(){const q=($('q').value||'').trim().toLowerCase(),year=$('year').value,cat=$('cat').value;const a=courses.filter(c=>(!year||c.AcademicYear===year)&&(!cat||(c.CategoryCounts||{})[cat])&&(!q||[c.CourseName,c.Trainer,c.Location,c.AcademicYear].join(' ').toLowerCase().includes(q)));$('content').innerHTML=a.length?`<div class="grid">${a.map(c=>`<article class="card"><h3>${esc(c.CourseName)}</h3><div class="muted">${esc(c.Trainer)} · ${esc(c.AcademicYear)}</div><div class="category-summary"><span class="pill">المشاركون: ${esc(c.ParticipantCount||0)}</span><span class="pill">${esc(c.DeliveryType||'')}</span>${c.CountMismatch?'<span class="pill warn">العدد المصدر يحتاج مراجعة</span>':''}</div><div class="muted">${esc(c.Date||'')} ${c.Time?'· '+esc(c.Time):''}</div><div class="muted">${esc(c.Location||'')}</div><div>${catsHtml(c.CategoryCounts)}</div><div class="actions"><button class="btn primary" onclick="openCourse('${esc(c.CourseID)}')">عرض التفاصيل</button></div></article>`).join('')}</div>`:'<div class="empty">لا توجد نتائج.</div>'}
async function openCourse(id){try{const r=await api({action:'getCourse',courseId:id});if(!r.success)throw Error(r.message);hideAll();$('detail').classList.remove('hidden');const c=r.course,ps=r.participants||[],cm=r.committee||[];$('detail').innerHTML=`<button class="btn secondary" onclick="showCourses()">← رجوع</button><h2>${esc(c.CourseName)}</h2><p><b>المدرب:</b> ${esc(c.Trainer)}</p><p><b>العام:</b> ${esc(c.AcademicYear)} &nbsp; <b>التاريخ:</b> ${esc(c.Date)} ${c.Time?' &nbsp; <b>الوقت:</b> '+esc(c.Time):''}</p><p><b>المكان:</b> ${esc(c.Location)} &nbsp; <b>طريقة التنفيذ:</b> ${esc(c.DeliveryType)}</p><div class="category-summary"><span class="pill">إجمالي الأسماء المسجلة: ${ps.length}</span>${c.DeclaredParticipantCount?`<span class="pill">العدد الوارد بالمصدر: ${esc(c.DeclaredParticipantCount)}</span>`:''}${catsHtml(c.CategoryCounts)}</div>${c.CountMismatch?'<div class="notice">يوجد اختلاف بين العدد الوارد في الملف الأصلي وعدد الأسماء المسجلة؛ تم الاحتفاظ بالقيمتين للمراجعة.</div>':''}<h3>المشاركون</h3>${ps.length?`<div class="table-wrap"><table class="table"><tr><th>م</th><th>الاسم</th><th>الفئة</th><th>الصفة / الوظيفة</th></tr>${ps.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.Name)}</td><td>${esc(p.Category)}</td><td>${esc(p.Detail)}</td></tr>`).join('')}</table></div>`:'<div class="empty">لا توجد أسماء مشاركين.</div>'}<h3>أعضاء لجنة التدريب</h3>${cm.length?cm.map(x=>`<span class="pill teal">${esc(x.Name)} — ${esc(x.Position)}</span>`).join(''):'<div class="muted">غير مسجلين في الملف المصدر لهذه الدورة.</div>'}`;}catch(e){alert(e.message)}}
function showCourses(){hideAll();$('public').classList.remove('hidden');$('q').value='';$('cat').value='';if(!courses.length)loadCourses();else renderCourses()}
async function showStats(){try{const r=await api({action:'stats'});if(!r.success)throw Error(r.message);hideAll();$('public').classList.remove('hidden');$('content').innerHTML=`<h2>الإحصائيات</h2><div class="stats"><div class="stat"><b>${r.totalCourses}</b>دورة / جلسة تدريبية</div><div class="stat"><b>${r.totalParticipants}</b>سجل مشاركة</div>${Object.entries(r.years||{}).map(([k,v])=>`<div class="stat"><b>${v}</b>${esc(k)}</div>`).join('')}</div><h3>المشاركون حسب الفئة</h3><div>${catsHtml(r.categories)}</div>`}catch(e){alert(e.message)}}
async function showCommittee(){try{const r=await api({action:'listCommittee'});hideAll();$('public').classList.remove('hidden');$('content').innerHTML=`<h2>أعضاء لجنة التدريب</h2><div class="grid">${(r.committee||[]).map(x=>`<article class="card"><h3>${esc(x.Name)}</h3><div class="muted">${esc(x.Position)}</div></article>`).join('')}</div>`}catch(e){alert(e.message)}}
function login(){const p=prompt('أدخل كلمة مرور المسؤول');if(!p)return;adminPassword=p;adminHome()}
async function adminHome(){try{const r=await api({action:'listCourses'});if(!r.success)throw Error(r.message);const check=await api({action:'adminCourse',password:adminPassword,courseId:(r.courses&&r.courses[0]&&r.courses[0].CourseID)||'__none__'});if(r.courses?.length && !check.success)throw Error(check.message);courses=r.courses||[];hideAll();$('admin').classList.remove('hidden');$('admin').innerHTML=`<div class="section-title"><h2>لوحة المسؤول</h2><button class="btn secondary" onclick="showCourses()">خروج</button></div><div class="notice">المسؤول فقط يمكنه الإضافة والتعديل والحذف. باقي مستخدمي الرابط مشاهدة فقط.</div><div class="actions"><button class="btn primary" onclick="courseForm()">+ إضافة دورة</button><button class="btn secondary" onclick="manageMembers()">إدارة لجنة التدريب</button></div><div class="grid" style="margin-top:14px">${courses.map(c=>`<article class="card"><h3>${esc(c.CourseName)}</h3><div class="muted">${esc(c.AcademicYear)} · ${esc(c.Trainer)}</div><div class="actions"><button class="btn secondary" onclick="courseForm('${esc(c.CourseID)}')">تعديل الدورة</button><button class="btn secondary" onclick="manageParticipants('${esc(c.CourseID)}')">المشاركون</button><button class="btn secondary" onclick="manageCourseCommittee('${esc(c.CourseID)}')">اللجنة</button><button class="btn accent" onclick="deleteCourse('${esc(c.CourseID)}')">حذف</button></div></article>`).join('')}</div>`}catch(e){alert(e.message)}}
function courseForm(id=''){const c=courses.find(x=>x.CourseID===id)||{};hideAll();$('admin').classList.remove('hidden');$('admin').innerHTML=`<button class="btn secondary" onclick="adminHome()">← رجوع</button><h2>${id?'تعديل دورة':'إضافة دورة'}</h2><div class="form"><div class="field full"><label>اسم الدورة <span>*</span></label><input id="fName" placeholder="اكتب اسم الدورة" value="${esc(c.CourseName)}"></div><div class="field"><label>اسم المدرب</label><input id="fTrainer" placeholder="اسم المدرب" value="${esc(c.Trainer)}"></div><div class="field"><label>العام الأكاديمي</label><input id="fYear" placeholder="مثال: 2026-2027" value="${esc(c.AcademicYear)}"></div><div class="field"><label>تاريخ الدورة</label><input id="fDate" placeholder="مثال: 28/10/2026" value="${esc(c.Date)}"></div><div class="field"><label>وقت الدورة</label><input id="fTime" placeholder="مثال: 10:00 ص - 12:00 م" value="${esc(c.Time)}"></div><div class="field"><label>المكان</label><input id="fLocation" placeholder="مكان تنفيذ الدورة" value="${esc(c.Location)}"></div><div class="field"><label>طريقة التنفيذ</label><select id="fType"><option ${c.DeliveryType==='أوفلاين'?'selected':''}>أوفلاين</option><option ${c.DeliveryType==='أونلاين'?'selected':''}>أونلاين</option></select></div><div class="field"><label>العدد الوارد بالبيان <small>(اختياري)</small></label><input id="fDeclared" type="number" min="0" placeholder="مثال: 20" value="${esc(c.DeclaredParticipantCount)}"></div><div class="field full"><label>ملاحظات</label><textarea id="fNotes" placeholder="أي ملاحظات إضافية">${esc(c.Notes)}</textarea></div></div><div class="actions"><button class="btn primary" onclick="saveCourse('${esc(id)}')">حفظ</button><button class="btn secondary" onclick="adminHome()">إلغاء</button></div>`}
async function saveCourse(id){const r=await api({action:'saveCourse',password:adminPassword,CourseID:id,CourseName:$('fName').value,Trainer:$('fTrainer').value,AcademicYear:$('fYear').value,Date:$('fDate').value,Time:$('fTime').value,Location:$('fLocation').value,DeliveryType:$('fType').value,DeclaredParticipantCount:$('fDeclared').value,Notes:$('fNotes').value});if(!r.success)return alert(r.message);adminHome()}
async function deleteCourse(id){if(!confirm('سيتم حذف الدورة وكل المشاركين وروابط اللجنة المرتبطة بها. متابعة؟'))return;const r=await api({action:'deleteCourse',password:adminPassword,courseId:id});if(!r.success)return alert(r.message);adminHome()}
async function manageParticipants(cid){const r=await api({action:'adminCourse',password:adminPassword,courseId:cid});if(!r.success)return alert(r.message);hideAll();$('admin').classList.remove('hidden');$('admin').innerHTML=`<button class="btn secondary" onclick="adminHome()">← رجوع</button><div class="section-title"><h2>مشاركو: ${esc(r.course.CourseName)}</h2><button class="btn primary" onclick="participantForm('${esc(cid)}')">+ إضافة مشارك</button></div><div class="category-summary">${catsHtml(r.course.CategoryCounts)}</div><div class="table-wrap"><table class="table"><tr><th>الاسم</th><th>الفئة</th><th>الصفة</th><th>إجراءات</th></tr>${(r.participants||[]).map(p=>`<tr><td>${esc(p.Name)}</td><td>${esc(p.Category)}</td><td>${esc(p.Detail)}</td><td><button class="btn secondary" onclick='participantForm(${JSON.stringify(cid)},${JSON.stringify(p)})'>تعديل</button> <button class="btn accent" onclick="deleteParticipant('${esc(p.ParticipantID)}','${esc(cid)}')">حذف</button></td></tr>`).join('')}</table></div>`}
function participantForm(cid,p={}){hideAll();$('admin').classList.remove('hidden');$('admin').innerHTML=`<button class="btn secondary" onclick="manageParticipants('${esc(cid)}')">← رجوع</button><h2>${p.ParticipantID?'تعديل مشارك':'إضافة مشارك'}</h2><div class="form"><input id="pName" class="full" placeholder="اسم المشارك" value="${esc(p.Name)}"><select id="pCat">${['طالب','عضو هيئة تدريس','عضو هيئة معاونة','إداري','قيادي','غير محدد'].map(x=>`<option ${p.Category===x?'selected':''}>${x}</option>`).join('')}</select><input id="pDetail" placeholder="الدرجة العلمية / الوظيفة / بيانات إضافية" value="${esc(p.Detail)}"></div><div class="actions"><button class="btn primary" onclick="saveParticipant('${esc(cid)}','${esc(p.ParticipantID||'')}')">حفظ</button></div>`}
async function saveParticipant(cid,pid){const r=await api({action:'saveParticipant',password:adminPassword,ParticipantID:pid,CourseID:cid,Name:$('pName').value,Category:$('pCat').value,Detail:$('pDetail').value});if(!r.success)return alert(r.message);manageParticipants(cid)}
async function deleteParticipant(pid,cid){if(!confirm('حذف المشارك؟'))return;const r=await api({action:'deleteParticipant',password:adminPassword,participantId:pid});if(r.success)manageParticipants(cid);else alert(r.message)}
async function manageCourseCommittee(cid){const r=await api({action:'adminCourse',password:adminPassword,courseId:cid});if(!r.success)return alert(r.message);const selected=new Set((r.committee||[]).map(x=>x.MemberID));hideAll();$('admin').classList.remove('hidden');$('admin').innerHTML=`<button class="btn secondary" onclick="adminHome()">← رجوع</button><h2>لجنة دورة: ${esc(r.course.CourseName)}</h2><div class="checkgrid">${(r.allCommittee||[]).map(m=>`<label class="check"><input type="checkbox" class="memberCheck" value="${esc(m.MemberID)}" ${selected.has(m.MemberID)?'checked':''}> <b>${esc(m.Name)}</b><div class="muted">${esc(m.Position)}</div></label>`).join('')}</div><div class="actions"><button class="btn primary" onclick="saveCourseCommittee('${esc(cid)}')">حفظ</button></div>`}
async function saveCourseCommittee(cid){const memberIds=[...document.querySelectorAll('.memberCheck:checked')].map(x=>x.value);const r=await api({action:'setCourseCommittee',password:adminPassword,courseId:cid,memberIds});if(!r.success)return alert(r.message);adminHome()}
async function manageMembers(){const r=await api({action:'listCommittee'});hideAll();$('admin').classList.remove('hidden');$('admin').innerHTML=`<button class="btn secondary" onclick="adminHome()">← رجوع</button><h2>إدارة أعضاء لجنة التدريب</h2><div class="actions"><button class="btn primary" onclick="memberForm()">+ إضافة عضو</button></div><div class="grid" style="margin-top:14px">${(r.committee||[]).map(m=>`<article class="card"><h3>${esc(m.Name)}</h3><div class="muted">${esc(m.Position)}</div><div class="actions"><button class="btn secondary" onclick='memberForm(${JSON.stringify(m)})'>تعديل</button><button class="btn accent" onclick="deleteMember('${esc(m.MemberID)}')">حذف</button></div></article>`).join('')}</div>`}
function memberForm(m={}){hideAll();$('admin').classList.remove('hidden');$('admin').innerHTML=`<button class="btn secondary" onclick="manageMembers()">← رجوع</button><h2>${m.MemberID?'تعديل عضو':'إضافة عضو'}</h2><div class="form"><input id="mName" placeholder="الاسم" value="${esc(m.Name)}"><input id="mPos" placeholder="الصفة" value="${esc(m.Position)}"></div><div class="actions"><button class="btn primary" onclick="saveMember('${esc(m.MemberID||'')}')">حفظ</button></div>`}
async function saveMember(mid){const r=await api({action:'saveCommittee',password:adminPassword,MemberID:mid,Name:$('mName').value,Position:$('mPos').value});if(r.success)manageMembers();else alert(r.message)}
async function deleteMember(mid){if(!confirm('حذف العضو وروابطه بالدورات؟'))return;const r=await api({action:'deleteCommittee',password:adminPassword,memberId:mid});if(r.success)manageMembers();else alert(r.message)}
showCourses();
</script></body></html>
